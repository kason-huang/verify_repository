  if (request?.method === 'POST') {
    const layout = request.layout ? ` · layout = ${request.layout}` : '';
    details.append(make('p', `POST ${request.path} · max_new_tokens = ${request.max_new_tokens}${layout}`));
    details.append(make('p', row.input_images
      ? '请求无历史，每张 JPEG 以 Base64 data URL 放入 images 数组。请求省略 layout。'
      : 'images 数组中包含一张 JPEG 的 Base64 data URL。近期通过校验的判断写在 question 中。'));
    details.append(make('h3', '完整 Prompt（question）'), make('pre', request.question, 'request-prompt'));
  } else if (request?.method === 'turn/start') {
    const effort = request.effort ? ` · effort = ${request.effort}` : '';
    details.append(make('p', `Codex app-server · turn/start${effort} · 沿用本段会话`));
    details.append(make('h3', '本窗口 Prompt（input.text）'), make('pre', request.text, 'request-prompt'));
    const instructions = data.astra_instructions;
    if (instructions?.rules) {
      const session = make('details');
      session.append(make('summary', '查看本段会话规则、预热和输出格式'),
        make('h3', '建会话规则（thread/start · developerInstructions）'), make('pre', instructions.rules));
      if (instructions.warmup) session.append(make('h3', '纯文本预热 Prompt'), make('pre', instructions.warmup));
      if (instructions.schema) session.append(make('h3', '本窗口输出约束（outputSchema）'),
        make('pre', JSON.stringify(instructions.schema, null, 2)));
      details.append(session);
    }
  }
  if (!row.input_images) {
    details.append(make('h3', data.astra_instructions ? '图片附件（localImage）' : '图片附件（images）'));
    if (row.sheet) {
      const link = make('a', null, 'sheet-preview');
      link.href = row.sheet; link.target = '_blank'; link.rel = 'noopener';
      const preview = make('img');
      preview.src = row.sheet; preview.alt = '打开本次发送的抽帧拼图'; preview.loading = 'lazy';
      link.append(preview);
      details.append(link);
    }
    return details;
  }
  details.append(make('h3', '图片附件（images）'));
  const list = make('ol');
  for (const [index, frame] of row.input_images.entries()) {
    const item = make('li');
    const label = `${index + 1}. ${frame.frame_id} · ${stamp(frame.time_s)}`;
    const link = make('a');
    link.href = frame.path; link.target = '_blank'; link.rel = 'noopener';
    const thumbnail = make('img');
    thumbnail.src = frame.path; thumbnail.alt = label; thumbnail.loading = 'lazy';
    link.append(thumbnail, make('span', label));
    item.append(link); list.append(item);
  }
  details.append(list);
  return details;
}
function drawResponseIssues(row) {
  const notes = [];
  const independent = data.input_mode === 'independent_frames';
  if (!independent) {
    if (row?.error_kind !== 'invalid_response' || data.model !== 'motvlm') return null;
    if (row.output_limit_reached) notes.push('模型输出达到 token 上限，回复可能被截断。');
    notes.push(...(row.validation_reasons ?? []));
    if (notes.length) notes.push('下方保留模型原始返回，本条未计入有效判断。');
  } else if (!row) {
    const rows = data.episodes.flatMap(episode => episode.timeline);
    const formatErrors = rows.filter(item => item.response_review?.original_error || item.error_kind === 'invalid_response').length;
    const conflicts = rows.filter(item => item.response_review?.status === 'conflict').length;
    if (formatErrors) notes.push(`${formatErrors} 条原始响应未通过格式校验，例如必填字段缺失或证据帧引用格式不合规。`);
    if (conflicts) notes.push(`${conflicts} 条响应的判断字段相互冲突。`);
  } else {
    const review = row.response_review;
    const originalError = review?.original_error ?? row.error;
    if (originalError === 'Model did not cite one or two valid observed frames') {
      notes.push('原始证据帧引用不符合要求，帧编号或引用数量有误。');
    } else if (originalError && (review || row.error_kind === 'invalid_response')) {
      notes.push('原始输出结构不符合预期。');
    }
    if (review?.missing.length) notes.push(`缺少可用字段（${review.missing.map(key => responseFields[key]).join('、')}）。`);
    if (review?.conflicts.length) notes.push(...review.conflicts.map(key => `${conflictLabels[key]}。`));
    if (review?.status === 'normalized') notes.push('已根据本次发送的图片统一证据引用。');
  }
  if (!notes.length) return null;
  const box = make('div', null, 'response-review');
  const list = make('ul');
  for (const note of notes) list.append(make('li', note));
  box.append(make('strong', !independent ? '检查未通过的原因' : row ? '本次响应的问题' : '本轮发现的问题'), list);
  return box;
}
function drawAssessment(row) {
  const panel = get('assessment');
  panel.replaceChildren();
  get('checkHeading').textContent = row ? `S2 判断 · ${stamp(row.observed_at_s)}` : 'S2 判断';
  const issues = drawResponseIssues(row);
  if (issues) panel.append(issues);
  if (row) {
    let timing = `${modelLabel()} 请求耗时 ${requestDuration(row)}`;
    if (Number.isFinite(row.turn_ack_seconds)) timing += ` · 本地确认 ${duration(row.turn_ack_seconds)} · 首个文本 ${duration(row.first_text_seconds)}`;
    if (Number.isFinite(row.server_elapsed_seconds)) timing += ` · 服务端耗时 ${duration(row.server_elapsed_seconds)}`;
    if (Number.isFinite(row.thread_start_seconds)) timing += ` · 会话创建 ${duration(row.thread_start_seconds)}（单独计时）`;
    if (row.warmup) timing += ` · 纯文本预热 ${duration(row.warmup.turn_completed_seconds)} · 首条视频请求前共等待 ${duration(row.before_first_video_seconds)}`;
    panel.append(make('p', timing, 'check-duration'));
  }
  let rawResponse;
  if (typeof row?.raw_response === 'string') {
    rawResponse = make('details', null, 'raw-response');
    if (row.error && row.sheet && data.model === 'motvlm') rawResponse.open = true;
    rawResponse.append(make('summary', '模型原始返回'), make('pre', row.raw_response));
  }
  if (!row || row.error) {
    panel.append(make('p', row?.error ?? '等待第一个视频窗口的判断。', row?.error ? 'error' : ''));
    if (row) panel.append(drawInput(row));
    if (rawResponse) panel.append(rawResponse);
    return;
  }
  const value = row.answer;
  const grid = make('dl', null, 'state-grid');
  function field(label, value) {
    const box = make('div');
    const result = make('dd');
    result.append(value);
    box.append(make('dt', label), result);
    grid.append(box);
  }
  field('当前阶段', phases[value.phase] ?? '未提供');
  field('任务结果', pill(outcomes[value.outcome] ?? '未提供', value.outcome));
  const intervention = value.needs_intervention == null ? '未提供' : value.needs_intervention ? '需要' : '无需';
  field('需要干预', pill(intervention, value.needs_intervention ? 'alert' : ''));
  field('建议动作', pill(decisions[value.decision] ?? '未提供', value.decision === 'retry' ? 'retry' : ''));
  panel.append(grid);
  if (value.progress) panel.append(make('div', value.progress));
  if (value.reason) panel.append(make('p', value.reason, 'why'));
  const proof = make('div', null, 'proof');
  for (const item of value.evidence) {
    const figure = make('figure');
    const anchor = make('a');
    anchor.href = item.path; anchor.target = '_blank'; anchor.rel = 'noopener';
    const image = make('img'); image.src = item.path; image.alt = item.observation;
    anchor.append(image);
    const cap = make('figcaption');
    const button = make('button', `跳到 ${stamp(item.time_s)}`);
    button.onclick = () => seek(item.time_s);
    cap.append(button, item.observation);
    figure.append(anchor, cap); proof.append(figure);
  }
  if (value.evidence.length > 2) {
    const evidenceList = make('details', null, 'evidence-list');
    evidenceList.append(make('summary', `查看模型引用的 ${value.evidence.length} 张证据帧`), proof);
    panel.append(evidenceList);
  } else if (value.evidence.length) {
    panel.append(proof);
  }
  panel.append(drawInput(row));
  if (rawResponse) panel.append(rawResponse);
}
function drawAtTime() {
  const episode = data.episodes[selected];
  if (!episode) return;
  get('position').textContent = `${stamp(player.currentTime)} / ${stamp(episode.duration_s)}`;
  const row = mode === 'latest' ? episode.timeline.at(-1) :
    episode.timeline.findLast(row => row.observed_at_s <= player.currentTime + 0.001);
  if (row !== currentRow) {
    currentRow = row;
    drawAssessment(row);
  }
  for (const button of get('timeline').querySelectorAll('button')) {
    button.setAttribute('aria-current', Number(button.dataset.index) === row?.index ? 'true' : 'false');
  }
}
function render() {
  const done = data.episodes.reduce((sum, item) => sum + item.checks_completed, 0);
  const total = data.episodes.reduce((sum, item) => sum + item.checks_expected, 0);
  const attempted = data.episodes.reduce((sum, item) => sum + item.timeline.length, 0);
  const errors = data.episodes.reduce((sum, item) => sum + item.errors.length, 0);
  const independentFrames = data.input_mode === 'independent_frames';
  const labelSuffix = independentFrames ? ' · 独立帧 · 无历史' : '';
  if (data.task) get('instruction').textContent = `${data.task} · ${modelLabel()}${labelSuffix}`;
  const measured = data.episodes.filter(item => item.checks_completed > 0);
  get('warmupNote').hidden = !measured.length || !measured.every(item => item.timeline[0]?.warmup?.response?.trim() === 'READY');
  const label = !total ? '等待评测准备' : attempted === total ? '评测完成' : live ? '评测运行中' : '评测未完成';
  if (independentFrames) {
    const rows = data.episodes.flatMap(episode => episode.timeline);
    const stats = [
      `${label} · ${attempted}/${total} 次`,
      `完整且无冲突 ${done} 次`,
      `部分返回 ${rows.filter(row => row.response_review?.status === 'partial').length} 次`,
      `判断冲突 ${rows.filter(row => row.response_review?.status === 'conflict').length} 次`,
    ];
    if (errors) stats.push(`无法解析 ${errors} 次`);
    runText = stats.join(' · ');
  } else {
    runText = !total ? label : errors ? `${label} · ${attempted}/${total} 次 · 有效 ${done} 次` : `${label} · ${done}/${total} 次检查`;
  }
  get('runState').textContent = runText;
  get('episodes').replaceChildren(...data.episodes.map((item, index) => {
    const button = make('button', `Episode ${item.episode.split('_').at(-1)}`);
    button.setAttribute('aria-pressed', index === selected);
    button.append(make('small', `${item.checks_completed}/${item.checks_expected} 次 · ${finalOutcome(item.final_outcome) ?? (item.errors.length ? '检查失败' : '未结束')}`));
    button.onclick = () => { selected = index; render(); };
    return button;
  }));
  const episode = data.episodes[selected];
  if (!episode) return;
  get('content').hidden = false;
  if (player.getAttribute('src') !== episode.video) player.setAttribute('src', episode.video);
  const rows = episode.timeline.map(row => {
    const button = make('button', null, 'event');
    button.dataset.index = row.index;
    const answer = row.answer;
    const timing = make('span');
    timing.append(make('time', stamp(row.observed_at_s)), make('small', `耗时 ${requestDuration(row)}`, 'duration'));
    const phase = make('span', answer ? phases[answer.phase] ?? '未提供' : '检查失败');
    if (row.response_review) phase.append(make('small', reviewLabels[row.response_review.status], 'review-label'));
    button.append(timing, phase, pill(answer ? outcomes[answer.outcome] ?? '未提供' : '错误', answer ? answer.outcome : 'failure'),
      make('span', answer ? `${answer.needs_intervention ? '需干预 · ' : ''}${answer.progress ?? ''}` : row.error, 'event-detail'));
    button.onclick = () => { setMode('playback'); seek(row.observed_at_s); };
    return button;
  });
  get('timeline').replaceChildren(...(rows.length ? rows : [make('p', '还没有检查记录。')]));
  let memory = '';
  if (independentFrames) {
    memory = '每次请求按时间顺序发送当前窗口的独立图片。证据中的数字帧号和时间戳只匹配本次发送的帧。部分返回与判断冲突均可查看，完整判断统计只计入字段齐全且无冲突的响应。';
  } else if (data.model === 'motvlm') {
    memory = 'MoTVLM 接口不保留会话，每次请求附带本段此前通过格式与证据编号检查的近期判断。';
  }
  get('note').textContent = `每 ${data.window_seconds} 秒提交一组按时间排序的抽帧。视频时间从本 episode 起点计，耗时为请求从发出到返回的实际用时。${memory}页面显示的是模型判断，未与人工真值比较。`;
  currentRow = null;
  setMode(mode);
}
get('playback').onclick = () => setMode('playback');
get('latest').onclick = () => setMode('latest', true);
player.addEventListener('timeupdate', drawAtTime);
player.addEventListener('play', () => setMode('playback'));
if (live) {
  let lastPayload = '';
  async function update() {
    try {
      const response = await fetch('api', {cache:'no-store'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.text();
      if (lastPayload !== payload) {
        data = JSON.parse(payload);
        lastPayload = payload;
        render();
      } else if (runText) get('runState').textContent = runText;
    } catch (error) {
      get('runState').textContent = '评测服务连接中断，正在重试';
    } finally {
      setTimeout(update, 1250);
    }
  }
  update();
} else render();
</script>
</body>
