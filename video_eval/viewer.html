<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 视频监控评测</title>
<style>
:root{color-scheme:light;--ink:#17242d;--muted:#52656f;--line:#dce5e9;--panel:#fff;--accent:#006967;--accent-soft:#e1f2ee;--red:#9e3028;--red-soft:#fceae7;--amber:#83500d;--amber-soft:#fff3d9}
*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:var(--ink);font:15px/1.55 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:32px 24px 60px}h1{font-size:clamp(24px,3vw,36px);line-height:1.15;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{margin:0;color:var(--muted)}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.instruction{color:var(--ink);font-size:14px;overflow-wrap:anywhere}.badge,.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap;background:#e9eff2;color:#364b58}.badge{font-variant-numeric:tabular-nums}.success{color:var(--accent);background:var(--accent-soft)}.failure,.alert{color:var(--red);background:var(--red-soft)}.uncertain,.retry{color:var(--amber);background:var(--amber-soft)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 11px;color:var(--ink);background:#fff;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true]{color:#fff;background:var(--accent);border-color:var(--accent)}button:disabled{cursor:default;opacity:.55}button small{display:block;font-size:11px;opacity:.82}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.player video{width:100%;aspect-ratio:4/3;display:block;background:#111b20;border-radius:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar span{font-variant-numeric:tabular-nums;color:var(--muted)}.mode{display:flex;gap:6px}.state-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow-wrap:anywhere;gap:9px;margin:0 0 12px}.state-grid div{border:1px solid var(--line);border-radius:9px;padding:9px 11px}.state-grid dt{font-size:12px;color:var(--muted);margin-bottom:3px}.state-grid dd{margin:0}.why{margin:6px 0 0}.proof{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.proof figure{margin:0;min-width:0}.proof img{width:100%;display:block;border-radius:6px}.proof figcaption{font-size:13px;line-height:1.45;margin-top:5px}.proof button{padding:1px 5px;margin:0 4px 4px 0;font-size:12px}.input-link{display:inline-block;margin-top:12px;color:var(--accent);font-size:13px}.history{margin-top:16px}.history-list{display:grid;gap:6px}.event{width:100%;display:grid;grid-template-columns:90px 104px 112px minmax(0,1fr);gap:8px;align-items:center;text-align:left}.event[aria-current=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.event time{font-variant-numeric:tabular-nums}.event .pill{width:max-content}.note{font-size:13px;margin-top:14px}.error{color:var(--red)}[hidden]{display:none!important}
@media(max-width:800px){main{padding:22px 12px}.grid{grid-template-columns:1fr}.event{grid-template-columns:65px 78px 86px minmax(0,1fr);gap:5px;font-size:13px}.event .pill{font-size:11px;padding:3px 6px}}@media(max-width:500px){.event .event-detail{grid-column:1/-1}header{display:block}#runState{margin-top:9px}}
.event .duration{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}.check-duration{font-size:13px;margin:-6px 0 10px}
</style>
</head>
<body>
<main>
<header>
  <div><h1>S2 视频监控评测</h1><p id="instruction" class="instruction"></p>
    <p id="warmupNote" class="note" hidden>本报告的数据在 Astra 预热后获得。每个 episode 先在同一会话发送一条纯文本预热请求，再提交视频画面。预热耗时单独记录。</p>
  </div>
  <span id="runState" class="badge" role="status">正在读取评测</span>
</header>
<nav id="episodes" aria-label="选择 episode"></nav>
<div id="content" hidden>
  <div class="grid">
    <section class="panel player" aria-label="任务视频">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="toolbar">
        <span id="position"></span>
        <div class="mode"><button id="playback" aria-pressed="true">跟随播放</button><button id="latest" aria-pressed="false">最新判断</button></div>
      </div>
    </section>
    <section class="panel" aria-label="S2 判断">
      <h2 id="checkHeading">S2 判断</h2>
      <div id="assessment"></div>
    </section>
  </div>
  <section class="panel history" aria-label="判断时间线">
    <h2>判断时间线</h2><div id="timeline" class="history-list"></div>
  </section>
  <p id="note" class="note"></p>
</div>
<noscript>请启用 JavaScript，以查看视频和判断时间线。</noscript>
</main>
<script type="application/json" id="initialData"><!-- REPORT_DATA --></script>
<script>
const get = id => document.getElementById(id);
const make = (tag, value, className) => {
  const node = document.createElement(tag);
  if (value != null) node.textContent = value;
  if (className) node.className = className;
  return node;
};
const player = get('player');
const outcomes = {in_progress:'进行中', success:'成功', failure:'失败', uncertain:'无法确认'};
const phases = {waiting:'等待', approaching:'接近盒子', grasping:'尝试抓取', lifting:'提起', retrying:'重新尝试', after_pick:'已完成抓取', unclear:'阶段不明'};
const decisions = {continue:'继续', retry:'重试', intervene:'干预', finish:'结束', observe:'继续观察'};
const initial = get('initialData').textContent.trim();
const live = initial === '<!-- REPORT_DATA -->';
let data = live ? {episodes:[]} : JSON.parse(initial);
let selected = 0;
let mode = live ? 'latest' : 'playback';
let currentRow = null;
let runText = '';
const stamp = value => `${Number(value).toFixed(3)} s`;
const duration = value => Number.isFinite(value) ? `${value.toFixed(2)} s` : '—';
const requestDuration = row => duration(row.request_seconds);
const pill = (value, tone) => make('span', value, `pill ${tone || ''}`);

function seek(time) {
  if (player.readyState === 0) {
    player.addEventListener('loadedmetadata', () => { player.currentTime = time; }, {once:true});
  } else {
    player.currentTime = time;
  }
}
function setMode(next, jump = false) {
  mode = next;
  get('playback').setAttribute('aria-pressed', mode === 'playback');
  get('latest').setAttribute('aria-pressed', mode === 'latest');
  const row = data.episodes[selected]?.timeline.at(-1);
  if (jump && row) seek(row.observed_at_s);
  drawAtTime();
}
function drawAssessment(row) {
  const panel = get('assessment');
  panel.replaceChildren();
  get('checkHeading').textContent = row ? `S2 判断 · ${stamp(row.observed_at_s)}` : 'S2 判断';
  if (row) {
    let timing = `Astra 请求耗时 ${requestDuration(row)}`;
    if (Number.isFinite(row.turn_ack_seconds)) timing += ` · 本地确认 ${duration(row.turn_ack_seconds)} · 首个文本 ${duration(row.first_text_seconds)}`;
    if (Number.isFinite(row.thread_start_seconds)) timing += ` · 会话创建 ${duration(row.thread_start_seconds)}（单独计时）`;
    if (row.warmup) timing += ` · 纯文本预热 ${duration(row.warmup.turn_completed_seconds)} · 首条视频请求前共等待 ${duration(row.before_first_video_seconds)}`;
    panel.append(make('p', timing, 'check-duration'));
  }
  if (!row || row.error) {
    panel.append(make('p', row?.error ?? '等待第一个视频窗口的判断。', row?.error ? 'error' : ''));
    return;
  }
  const value = row.answer;
  const grid = make('dl', null, 'state-grid');
  function field(label, value) {
    const box = make('div');
    const result = make('dd');
    result.append(value);
    box.append(make('dt', label), result);
    grid.append(box);
  }
  field('当前阶段', phases[value.phase]);
  field('任务结果', pill(outcomes[value.outcome], value.outcome));
  field('需要干预', pill(value.needs_intervention ? '需要' : '无需', value.needs_intervention ? 'alert' : ''));
  field('建议动作', pill(decisions[value.decision], value.decision === 'retry' ? 'retry' : ''));
  panel.append(grid, make('div', value.progress), make('p', value.reason, 'why'));
  const proof = make('div', null, 'proof');
  for (const item of value.evidence) {
    const figure = make('figure');
    const anchor = make('a');
    anchor.href = item.path; anchor.target = '_blank'; anchor.rel = 'noopener';
    const image = make('img'); image.src = item.path; image.alt = item.observation;
    anchor.append(image);
    const cap = make('figcaption');
    const button = make('button', `跳到 ${stamp(item.time_s)}`);
    button.onclick = () => seek(item.time_s);
    cap.append(button, item.observation);
    figure.append(anchor, cap); proof.append(figure);
  }
  const input = make('a', '打开该次送入模型的抽帧图', 'input-link');
  input.href = row.sheet; input.target = '_blank'; input.rel = 'noopener';
  panel.append(proof, input);
}
function drawAtTime() {
  const episode = data.episodes[selected];
  if (!episode) return;
  get('position').textContent = `${stamp(player.currentTime)} / ${stamp(episode.duration_s)}`;
  const row = mode === 'latest' ? episode.timeline.at(-1) :
    episode.timeline.findLast(row => row.observed_at_s <= player.currentTime + 0.001);
  if (row !== currentRow) {
    currentRow = row;
    drawAssessment(row);
  }
  for (const button of get('timeline').querySelectorAll('button')) {
    button.setAttribute('aria-current', Number(button.dataset.index) === row?.index ? 'true' : 'false');
  }
}
function render() {
  const done = data.episodes.reduce((sum, item) => sum + item.checks_completed, 0);
  const total = data.episodes.reduce((sum, item) => sum + item.checks_expected, 0);
  const errors = data.episodes.reduce((sum, item) => sum + item.errors.length, 0);
  if (data.task) get('instruction').textContent = `${data.task} · ${data.model}`;
  const measured = data.episodes.filter(item => item.checks_completed > 0);
  get('warmupNote').hidden = !measured.length || !measured.every(item => item.timeline[0]?.warmup?.response?.trim() === 'READY');
  const label = !total ? '等待评测准备' : errors ? '有检查失败' : done === total ? '评测完成' : live ? '评测运行中' : '评测未完成';
  runText = total ? `${label} · ${done}/${total} 次检查` : label;
  get('runState').textContent = runText;
  get('episodes').replaceChildren(...data.episodes.map((item, index) => {
    const button = make('button', `Episode ${item.episode.split('_').at(-1)}`);
    button.setAttribute('aria-pressed', index === selected);
    button.append(make('small', `${item.checks_completed}/${item.checks_expected} 次 · ${outcomes[item.final_outcome] ?? (item.errors.length ? '检查失败' : '未结束')}`));
    button.onclick = () => { selected = index; render(); };
    return button;
  }));
  const episode = data.episodes[selected];
  if (!episode) return;
  get('content').hidden = false;
  if (player.getAttribute('src') !== episode.video) player.setAttribute('src', episode.video);
  const rows = episode.timeline.map(row => {
    const button = make('button', null, 'event');
    button.dataset.index = row.index;
    const answer = row.answer;
    const timing = make('span');
    timing.append(make('time', stamp(row.observed_at_s)), make('small', `耗时 ${requestDuration(row)}`, 'duration'));
    button.append(timing, make('span', answer ? phases[answer.phase] : '检查失败'),
      pill(answer ? outcomes[answer.outcome] : '错误', answer?.outcome ?? 'failure'),
      make('span', answer ? `${answer.needs_intervention ? '需干预 · ' : ''}${answer.progress}` : row.error, 'event-detail'));
    button.onclick = () => { setMode('playback'); seek(row.observed_at_s); };
    return button;
  });
  get('timeline').replaceChildren(...(rows.length ? rows : [make('p', '还没有检查记录。')]));
  get('note').textContent = `每 ${data.window_seconds} 秒提交一组按时间排序的抽帧。视频时间从本 episode 起点计，耗时为每次 Astra 请求从发出到返回的实际用时。页面显示的是模型判断，未与人工真值比较。`;
  currentRow = null;
  setMode(mode);
}
get('playback').onclick = () => setMode('playback');
get('latest').onclick = () => setMode('latest', true);
player.addEventListener('timeupdate', drawAtTime);
player.addEventListener('play', () => setMode('playback'));
if (live) {
  let lastPayload = '';
  async function update() {
    try {
      const response = await fetch('/api', {cache:'no-store'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.text();
      if (lastPayload !== payload) {
        data = JSON.parse(payload);
        lastPayload = payload;
        render();
      } else if (runText) get('runState').textContent = runText;
    } catch (error) {
      get('runState').textContent = '评测服务连接中断，正在重试';
    } finally {
      setTimeout(update, 1250);
    }
  }
  update();
} else render();
</script>
</body>
</html>
